<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Design Studio</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Fabric.js for canvas manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🏗️ Generative Design Studio</h1>
            <p>AI-Powered Floor Plan Generation for AutoCAD</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <div class="input-box">
                <label for="prompt">Describe your building:</label>
                <textarea 
                    id="prompt" 
                    placeholder="Example: Design a 3-bedroom house with open kitchen and attached garage"
                    rows="3"
                ></textarea>
                <button id="generateBtn" class="btn-primary">
                    <span id="btnText">Generate Design</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>
            </div>
        </section>

        <!-- Canvas Editor Section -->
        <section id="editorSection" class="editor-section" style="display: none;">
            <div class="editor-header">
                <h2>Floor Plan Editor</h2>
                <div class="editor-controls">
                    <button id="saveBtn" class="btn-success">💾 Save Changes</button>
                    <div class="export-dropdown">
                        <button id="exportBtn" class="btn-primary">📥 Export</button>
                        <div id="exportMenu" class="export-menu">
                            <button data-format="lsp">AutoLISP (.lsp)</button>
                            <button data-format="dxf">DXF Format (.dxf)</button>
                            <button data-format="dwg">DWG Format (.dwg)</button>
                            <button data-format="json">JSON Data (.json)</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="editor-container">
                <!-- Canvas -->
                <div class="canvas-wrapper">
                    <canvas id="designCanvas"></canvas>
                </div>

                <!-- Property Panel -->
                <div id="propertyPanel" class="property-panel">
                    <h3>Properties</h3>
                    <div id="propertyContent">
                        <p class="hint">Select an element to view properties</p>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <button id="deleteBtn" class="tool-btn" title="Delete Selected">🗑️ Delete</button>
                <button id="undoBtn" class="tool-btn" title="Undo">↶ Undo</button>
                <button id="redoBtn" class="tool-btn" title="Redo">↷ Redo</button>
                <div class="separator"></div>
                <button id="zoomInBtn" class="tool-btn" title="Zoom In">🔍+ Zoom In</button>
                <button id="zoomOutBtn" class="tool-btn" title="Zoom Out">🔍- Zoom Out</button>
                <button id="fitBtn" class="tool-btn" title="Fit to View">⛶ Fit</button>
                <div class="separator"></div>
                <label class="tool-label">
                    <input type="checkbox" id="snapToGrid" checked>
                    Snap to Grid
                </label>
                <label class="tool-label">
                    <input type="checkbox" id="showGrid" checked>
                    Show Grid
                </label>
            </div>
        </section>

        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Project Info -->
        <div id="projectInfo" class="project-info" style="display: none;">
            <p><strong>Project ID:</strong> <span id="projectId"></span></p>
            <p><strong>Building Type:</strong> <span id="buildingType"></span></p>
            <p><strong>Total Area:</strong> <span id="totalArea"></span> sq.ft</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
